<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Appointments - SmartCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-around align-items-center p-3 flex-wrap gap-3">
            <div class="logo-container d-flex align-items-center gap-2">
                <a class="text-none" href="index.html"><img style="width: 48px; height: auto;" src="./images/logo.png" alt="SmartCare"></a>
                <h3 class="mb-0"><a href="index.html">SmartCare</a></h3>
            </div>
            <ul class="menu-container d-flex align-items-center gap-4 mb-0 ps-0">
                <li class="menu"><a href="index.html">Home</a></li>
                <li class="menu"><a href="userDetails.html">Profile</a></li>
                <li class="menu"><a onclick="handleLogout(event)" href="#" class="text-danger">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <div class="card shadow-sm border-0 p-4 rounded-4">
            <h2 class="text-center fw-bold mb-4">My Appointments</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Symptom</th>
                            <th>Doctor</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Cancel</th>
                            <th>Fees</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="p-5 mt-5">
        <div class="container row m-auto">
            <div class="col-md-6 text-center">
                <p class="mb-0"><small>Copyright &copy; SmartCare Hospital. All Rights Reserved</small></p>
            </div>
            <div class="col-md-6 text-center">
                <h5>Follow Us</h5>
                <div class="icons d-flex justify-content-center gap-3">
                    <a href="#"><img src="./images/LinkedIn.png" alt="LinkedIn"></a>
                    <a href="#"><img src="./images/YouTube.png" alt="YouTube"></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="allAppointment.js"></script>
    <script src="logout.js"></script>
</body>
</html>
