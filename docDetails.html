<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Details - SmartCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/swiffy-slider@1.6.0/dist/css/swiffy-slider.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-around align-items-center p-3 flex-wrap gap-3">
            <div class="logo-container d-flex align-items-center gap-2">
                <a class="text-none" href="index.html"><img style="width: 48px; height: auto;" src="./images/logo.png" alt="SmartCare Logo"></a>
                <h3 class="mb-0"><a href="index.html">SmartCare</a></h3>
            </div>
            <ul class="menu-container d-flex align-items-center gap-4 mb-0 ps-0">
                <li class="menu"><a href="index.html">Home</a></li>
                <li class="menu"><a href="allAppointment.html">All Appointments</a></li>
                <li class="menu"><a href="userDetails.html">Profile</a></li>
                <li class="menu"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <!-- Doctor Profile Container -->
        <div id="doc-details" class="row align-items-center bg-white shadow-sm p-4 rounded-4 mb-5">
        </div>

        <!-- Doctor Personal Reviews Section (Required in Module 18-6) -->
        <section class="review-container text-center mt-5">
            <h2 class="title mb-2">Patient Reviews for This Doctor</h2>
            <p class="description">Verified feedback from patients treated by this specialist.</p>
            <div id="doc-details-review" class="row g-4 justify-content-center mt-2">
            </div>
        </section>

        <!-- Appointment Booking Modal (Module 18-7, 18-8, 18-9) -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="exampleModalLabel">Submit Your Appointment Info</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold d-block">Appointment Type</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="offlineRadio" value="Offline" checked>
                                <label class="form-check-label" for="offlineRadio">Offline</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="onlineRadio" value="Online">
                                <label class="form-check-label" for="onlineRadio">Online</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="symptom" class="form-label fw-semibold">Symptom</label>
                            <input id="symptom" type="text" class="form-control" placeholder="Type your symptoms here...">
                        </div>

                        <div class="mb-3">
                            <label for="time-container" class="form-label fw-semibold">Available Time Slot</label>
                            <select id="time-container" class="form-select" name="time">
                            </select>
                        </div>

                        <p id="appointment-feedback" class="small mb-0"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button onclick="handleAppointment()" type="button" class="btn btn-primary">Take Appointment</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-5 mt-5">
        <div class="container row m-auto">
            <div class="col-md-6 text-center">
                <p class="mb-0"><small>Copyright &copy; SmartCare Hospital. All Rights Reserved</small></p>
            </div>
            <div class="col-md-6 text-center">
                <h5>Follow Us</h5>
                <div class="icons d-flex justify-content-center gap-3">
                    <a href="#"><img src="./images/LinkedIn.png" alt="LinkedIn"></a>
                    <a href="#"><img src="./images/YouTube.png" alt="YouTube"></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="docDetails.js"></script>
    <script src="logout.js"></script>
</body>
</html>
