<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-around align-items-center p-3">
            <div class="logo-container d-flex align-items-center gap-2">
                <a class="text-none" href="index.html"><img style="width: 48px; height: auto;" src="./images/logo.png" alt="SmartCare"></a>
                <h3 class="mb-0"><a href="index.html">SmartCare</a></h3>
            </div>
            <ul class="menu-container d-flex gap-4 mb-0 ps-0">
                <li class="menu"><a href="index.html">Home</a></li>
                <li class="menu"><a href="reg.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="login-container shadow p-4 p-md-5">
            <h2 class="text-center fw-bold mb-4">Patient Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label for="login-username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="login-username" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                </div>
                <p id="error" class="text-danger small"></p>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                <p class="text-center mt-3 mb-0"><small>Don't have an account? <a class="text-primary fw-semibold" href="reg.html">Register</a></small></p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
