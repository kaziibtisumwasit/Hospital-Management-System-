<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - SmartCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <nav class="d-flex justify-content-around align-items-center p-3">
            <div class="logo-container d-flex align-items-center gap-2">
                <a class="text-none" href="index.html"><img style="width: 48px; height: auto;" src="./images/logo.png" alt="SmartCare"></a>
                <h3 class="mb-0"><a href="index.html">SmartCare</a></h3>
            </div>
            <ul class="menu-container d-flex gap-4 mb-0 ps-0">
                <li class="menu"><a href="index.html">Home</a></li>
                <li class="menu"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="login-container shadow p-4 p-md-5" style="max-width: 520px;">
            <h2 class="text-center fw-bold mb-4">Patient Registration</h2>
            <form onsubmit="handleRegistration(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" id="first_name" class="form-control" placeholder="First name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" id="last_name" class="form-control" placeholder="Last name" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 8 chars, 1 number & symbol" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter password" required>
                </div>
                <p id="error" class="text-danger small"></p>
                <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                <p class="text-center mt-3 mb-0"><small>Already have an account? <a class="text-primary fw-semibold" href="login.html">Login</a></small></p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
